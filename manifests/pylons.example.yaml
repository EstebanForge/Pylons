version: 1

# Global extensions enabled across all registered projects.
# Built-in: go, rust, typescript, python, php
# External plugins are enabled by their registered name from manifests/extensions.json.
extensions:
  - go
  - rust

# Gate-maintained manifests. Absent means both are maintained;
# an exact list hands the rest to foreign tooling.
# generate: [rules]

# Extra URI schemes this ledger recognizes. Well-formed declared
# links pass; malformed ones fail. Resolution semantics stay yours.
# schemes: [legacy, atlas]

# KB-relative globs removed from the engine entirely: never linted,
# never graph docs.
# exclude: [legacy/**]

# Optional custom protocol template overrides (defaults to protocols/<name>.md, then compiled-in templates).
protocols:
  reflect: protocols/reflect.md

# Tracked projects (paths are relative to the Pylons root or absolute).
projects:
  example-rust-core:
    path: ../example-rust-core/crates/example-rust-core
    ref: main
    tier: core
    extensions:
      - rust

  example-ts-app:
    path: ../example-ts-app
    ref: main
    tier: app
    extensions:
      - typescript

  example-go-service:
    path: ../example-go-service
    ref: main
    tier: service
    extensions:
      - go
      - golang

  example-php-app:
    path: ../example-php-app
    ref: main
    tier: app
    extensions:
      - php

  example-ruby-worker:
    path: ../example-ruby-worker
    ref: main
    tier: worker
    extensions:
      - ruby
